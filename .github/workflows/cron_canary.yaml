name: cron canary

# schedule が発火するかだけを見る。何も計算せず、LLM も呼ばない。
# 毎時 3,13,23,33,43,53 分（毎時境界を避ける。GitHub は境界で遅延しやすい）。
on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 時刻を出すだけ
        run: |
          echo "event=${{ github.event_name }}"
          echo "utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
