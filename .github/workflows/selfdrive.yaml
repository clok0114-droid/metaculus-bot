name: 自走ループ

# 承認済みの自走機構。
#
# このリポジトリでは GitHub の schedule が間引かれる（10分 cron を要求して
# 23時間で3回しか発火しなかった）ので、cron だけでは回らない。そこで実行の
# 最後に自分をもう一度起動する。GITHUB_TOKEN では仕様上ワークフローを
# 起動できないため、ここだけ PAT を使う。
#
# 止まる条件（どれか1つ成立で止まる）
#   1. 残高が下限を割った        → main.py が proceed=false を出す
#   2. 未予測の問題が無くなった  → hit_cap=false なので再起動しない
#   3. 反復回数を使い切った      → iterations_left が 1 まで減る
#   4. PAT が無い／失効した      → 再起動せず終了する
#   5. 予測ジョブが落ちた        → outputs が空になり再起動条件を満たさない
#
# PAT の封じ込め: 再起動ジョブは外部 action を一切使わない（sleep と curl
# だけ）。checkout や install-poetry と同じランナーに PAT を載せない。

on:
  # 3時間ごとの心拍。連鎖が止まったあとの拾い直しだけを担う。
  # 1回の上限は8問・$1.88、未予測が無ければ $0。
  schedule:
    - cron: "41 */3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "対象（tournament / minibench / market_pulse）"
        default: tournament
      tournament:
        description: "対象を明示する（slug か id。空なら --mode の既定）"
        default: ""
      max_questions:
        description: "1回の実行で予測する問題数の上限"
        default: "8"
      min_credits:
        description: "この残高（USD）を割ったら止める"
        default: "1.00"
      iterations_left:
        description: "残りの反復回数。1回ごとに減る"
        default: "24"
      sleep_seconds:
        description: "次の起動まで待つ秒数"
        default: "1200"

concurrency:
  group: selfdrive
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      proceed: ${{ steps.run.outputs.proceed }}
      hit_cap: ${{ steps.run.outputs.hit_cap }}
      forecasted: ${{ steps.run.outputs.forecasted }}
      remaining: ${{ steps.run.outputs.remaining }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # SHA 固定。secrets が載るジョブで外部 action をタグ参照にしておくと、
      # タグの差し替えが鍵の窃取経路になる。
      - uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      - name: 依存を入れる
        run: poetry install --no-interaction --no-root
      - name: 予測する
        id: run
        run: |
          poetry run python main.py \
            --mode "${{ inputs.mode || 'tournament' }}" \
            --tournament "${{ inputs.tournament }}" \
            --max-questions "${{ inputs.max_questions || '8' }}" \
            --min-credits "${{ inputs.min_credits || '1.00' }}"
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
      - name: この回の結果
        run: |
          echo "予測した問題   ${{ steps.run.outputs.forecasted }}"
          echo "残高           ${{ steps.run.outputs.remaining }} USD"
          echo "続行可         ${{ steps.run.outputs.proceed }}"
          echo "上限まで使った ${{ steps.run.outputs.hit_cap }}"

  rearm:
    needs: forecast
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # 上限まで使った＝まだ未予測が残っている、ときだけ次を予約する。
    # 残っていなければここで止め、次は手動か心拍に任せる。
    if: >-
      needs.forecast.outputs.proceed == 'true' &&
      needs.forecast.outputs.hit_cap == 'true'
    steps:
      - name: 次の回を予約する
        env:
          SELFDRIVE_PAT: ${{ secrets.SELFDRIVE_PAT }}
          MODE: ${{ inputs.mode || 'tournament' }}
          TOURN: ${{ inputs.tournament }}
          MAXQ: ${{ inputs.max_questions || '8' }}
          MINC: ${{ inputs.min_credits || '1.00' }}
          LEFT: ${{ inputs.iterations_left || '24' }}
          NAP: ${{ inputs.sleep_seconds || '1200' }}
        run: |
          set -eu
          if [ -z "${SELFDRIVE_PAT:-}" ]; then
            echo "SELFDRIVE_PAT が無い。再起動しない"
            exit 0
          fi
          NEXT=$((LEFT - 1))
          if [ "$NEXT" -le 0 ]; then
            echo "反復回数を使い切った。ここで止まる"
            exit 0
          fi
          echo "${NAP} 秒待ってから、残り ${NEXT} 回として起動する"
          sleep "$NAP"
          payload=$(printf '{"ref":"main","inputs":{"mode":"%s","tournament":"%s","max_questions":"%s","min_credits":"%s","iterations_left":"%s","sleep_seconds":"%s"}}' \
            "$MODE" "$TOURN" "$MAXQ" "$MINC" "$NEXT" "$NAP")
          code=$(curl -sS -o /tmp/dispatch.txt -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${SELFDRIVE_PAT}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/selfdrive.yaml/dispatches" \
            -d "$payload")
          echo "HTTP ${code}"
          if [ "$code" != "204" ]; then
            cat /tmp/dispatch.txt
            echo "起動に失敗した。ループはここで止まる"
            exit 1
          fi
          echo "次の回を予約した"
